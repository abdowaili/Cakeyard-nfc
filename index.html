<style>
:root{--ink:#4D3658;--purple:#644F71;--lavender:#D0C4DC;--soft:#A998B9;--cream:#EFEAE4;--white:#fffdfb;--shadow:0 16px 36px rgba(67,44,77,.13)}
*{box-sizing:border-box}html{min-height:100%;scroll-behavior:smooth}body{margin:0;min-height:100svh;background:radial-gradient(circle at 18% 4%,#fff9f2 0,transparent 42%),linear-gradient(145deg,#f5eeea,#e8dce8 78%,#e9dce5);font-family:Tajawal,'DM Sans',sans-serif;color:var(--ink);overflow-x:hidden}
.scene{min-height:100svh;display:grid;place-items:center;padding:30px 16px 36px;position:relative;isolation:isolate}.ambient{position:fixed;pointer-events:none;filter:blur(32px);z-index:-1;border-radius:50%;opacity:.52;animation:drift 14s ease-in-out infinite alternate}.ambient.one{background:#d5c1d8;width:36vw;height:35vw;left:-10vw;top:15vh}.ambient.two{background:#fae4d6;width:45vw;height:38vw;right:-16vw;bottom:-5vh;animation-delay:-5s}
.page{width:min(100%,438px);min-height:760px;background:linear-gradient(160deg,#fffaf5 1%,#faf0ed 51%,#f5e9ed 100%);border:1px solid rgba(255,255,255,.9);border-radius:40px;box-shadow:0 32px 90px #49375126,0 7px 24px #57456012;overflow:hidden;position:relative;animation:arrive 900ms cubic-bezier(.2,.7,.2,1) both;text-align:center}
.page:before{content:'';position:absolute;inset:10px;border:1px solid rgba(100,79,113,.12);border-radius:31px;pointer-events:none;z-index:4}
.inner{position:relative;z-index:2;padding:54px 33px 0}.eyebrow{font:600 10px 'DM Sans',sans-serif;letter-spacing:.42em;color:#aa93b4;display:block;margin-bottom:22px}.brand{width:244px;max-width:83%;height:auto;display:block;margin:0 auto;filter:drop-shadow(0 2px 0 #ffffff70)}.spark{position:absolute;color:#b2a0c1;font-size:23px;animation:glimmer 3.8s ease-in-out infinite}.spark.left{top:92px;left:66px}.spark.right{top:170px;right:49px;font-size:13px;animation-delay:1.7s}.line{width:48px;height:1px;background:#aa8eae;margin:28px auto 20px;opacity:.8}.welcome{margin:0;font-size:29px;font-weight:800;letter-spacing:-.03em;line-height:1.4}.tagline{margin:3px 0 27px;font-size:15px;font-weight:600;color:#a78fb0}.micro{display:block;font:600 9px 'DM Sans',sans-serif;letter-spacing:.3em;color:#ac93ac;margin-bottom:13px}.actions{display:flex;flex-direction:column;gap:13px}.action{display:flex;align-items:center;gap:14px;text-decoration:none;text-align:right;min-height:83px;border-radius:25px;padding:14px 19px;position:relative;overflow:hidden;transition:transform .3s cubic-bezier(.2,.8,.2,1),box-shadow .3s,background .3s;outline-offset:4px}.action:hover{transform:translateY(-4px)}.action:active{transform:translateY(0) scale(.98)}.action.primary{color:#fff;background:linear-gradient(120deg,#735780,#4D3658);box-shadow:0 12px 24px rgba(77,54,88,.24)}.action.primary:hover{box-shadow:0 17px 30px rgba(77,54,88,.32)}.action.secondary{background:#fffaf8e8;color:var(--ink);border:1px solid #e4d5e1;box-shadow:0 9px 26px #6d4d6c16}.action.secondary:hover{background:#fff}.action:before{content:'';position:absolute;width:45%;height:240%;background:linear-gradient(90deg,transparent,#ffffff30,transparent);transform:rotate(25deg);left:-80%;top:-80%;transition:left .8s}.action:hover:before{left:120%}.icon-wrap{width:45px;height:45px;display:grid;place-items:center;flex:none;border-radius:14px;background:#ffffff1b}.secondary .icon-wrap{background:#f4e9f3}.icon-wrap svg{width:26px;height:26px;fill:none;stroke:currentColor;stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round}.action-copy{flex:1}.action-title{font-size:20px;font-weight:800;line-height:1.35}.action-sub{font-size:12px;opacity:.74;font-weight:500;margin-top:3px}.arrow{width:20px;height:20px;stroke:currentColor;stroke-width:1.7;fill:none;opacity:.8}.divider{margin:26px auto 4px;display:flex;align-items:center;gap:14px;color:#a98cb2;font-size:19px;justify-content:center}.divider:before,.divider:after{content:'';height:1px;width:62px;background:linear-gradient(90deg,transparent,#cbb3ca)}.divider:after{transform:rotate(180deg)}
.photo-area{position:relative;margin:4px auto 0;width:100%;height:240px;overflow:hidden;mask-image:linear-gradient(to bottom,transparent 0%,black 16%,black 100%);-webkit-mask-image:linear-gradient(to bottom,transparent 0%,black 16%,black 100%)}.photo{width:100%;height:100%;object-fit:cover;object-position:center 42%;display:block;animation:floatcake 7s ease-in-out infinite alternate}.photo-area:after{content:'';position:absolute;inset:auto 0 0;height:35px;background:linear-gradient(transparent,#f5e9ed9a);pointer-events:none}.footer{position:absolute;bottom:20px;left:0;right:0;font:600 10px 'DM Sans',sans-serif;letter-spacing:.24em;color:#755f7c;opacity:.7;z-index:3}.credit{margin-top:20px;color:#866f8c;font-size:12px;text-align:center;opacity:.85}
@keyframes arrive{from{opacity:0;transform:translateY(20px) scale(.98)}to{opacity:1;transform:translateY(0) scale(1)}}@keyframes drift{to{transform:translate(28px,-25px)}}@keyframes glimmer{0%,100%{transform:scale(.75) rotate(0);opacity:.35}45%{transform:scale(1.18) rotate(14deg);opacity:1}}@keyframes floatcake{from{transform:scale(1.015) translateY(2px)}to{transform:scale(1.06) translateY(-3px)}}
@media(max-width:480px){.scene{padding:0}.page{width:100%;max-width:none;min-height:100svh;border-radius:0;border:0;box-shadow:none}.page:before{border-radius:0;inset:0;border:0}.inner{padding:clamp(48px,9svh,86px) 28px 0}.photo-area{height:clamp(190px,28svh,290px)}.footer{bottom:16px}}@media(max-width:360px){.inner{padding-inline:22px}.welcome{font-size:26px}.action{min-height:74px}.photo-area{height:180px}}@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation-duration:.001ms!important;animation-iteration-count:1!important;transition-duration:.001ms!important;scroll-behavior:auto!important}}
